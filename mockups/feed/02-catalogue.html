<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blawx — Catalogue</title>
  <style>
    :root {
      --paper: #f4f4f2;
      --ink: #121212;
      --quiet: #676763;
      --line: #b9b9b4;
      --yellow: #ffd529;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      --space-3xl: 48px;
      --space-4xl: 64px;
      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(100% - 32px, 1376px); margin: 0 auto; }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--ink);
    }
    .brand {
      color: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.04em;
      text-decoration: none;
    }
    .privacy { font-size: 12px; color: var(--quiet); }

    .intro {
      padding: 44px 0 48px;
    }
    .composer-wrap { display: grid; gap: var(--space-md); }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      border: 1px solid var(--ink);
      background: var(--paper);
      min-height: 92px;
    }
    textarea {
      width: 100%;
      min-width: 0;
      min-height: 90px;
      padding: 27px 22px 20px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -.025em;
      resize: none;
    }
    textarea::placeholder { color: #777772; opacity: 1; }
    textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
    .make {
      min-width: 120px;
      border: 0;
      border-left: 1px solid var(--ink);
      background: var(--yellow);
      font-weight: 700;
      cursor: pointer;
    }
    .make:hover { background: #f5c900; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .form-note { min-height: 16px; margin: 0; color: var(--quiet); font-size: 12px; }

    .section-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-lg);
      padding: 14px 0;
      border-top: 1px solid var(--ink);
    }
    .section-line h2 { margin: 0; font-size: 13px; font-weight: 700; }
    .section-line span { color: var(--quiet); font-size: 12px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: minmax(240px, 28vw) minmax(210px, 24vw) minmax(180px, 18vw);
      gap: 1px;
      background: var(--ink);
      border: 1px solid var(--ink);
    }
    .set-card {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      overflow: hidden;
      border: 0;
      padding: 0;
      background: var(--paper);
      cursor: pointer;
      text-align: left;
    }
    .set-card:first-child { grid-column: span 7; grid-row: span 2; }
    .set-card:nth-child(2), .set-card:nth-child(3) { grid-column: span 5; }
    .set-card:nth-child(n+4) { grid-column: span 4; }
    .set-card img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      padding: clamp(12px, 2vw, 30px);
      transition: transform 320ms cubic-bezier(.22,1,.36,1);
    }
    .set-card:hover img { transform: scale(1.018); }
    .card-copy {
      display: grid;
      gap: 5px;
      padding: 13px 16px 15px;
      border-top: 1px solid var(--ink);
      color: var(--ink);
      background: var(--paper);
    }
    .card-title { font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
    .card-prompt { overflow-wrap: anywhere; font-size: 14px; line-height: 1.35; }

    .detail[hidden], .gallery-view[hidden] { display: none; }
    .detail-nav {
      display: flex;
      justify-content: space-between;
      gap: var(--space-lg);
      padding: 14px 0;
      border-top: 1px solid var(--ink);
    }
    .text-button {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(270px, .62fr);
      min-height: min(68vw, 760px);
      border: 1px solid var(--ink);
    }
    .detail-figure { margin: 0; overflow: hidden; background: var(--paper); }
    .detail-figure img { width: 100%; height: 100%; object-fit: contain; padding: clamp(16px, 3vw, 48px); }
    .detail-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-2xl);
      padding: clamp(24px, 3.3vw, 48px);
      border-left: 1px solid var(--ink);
    }
    .detail-copy h2 { margin: 0; font-size: clamp(32px, 4vw, 58px); line-height: .96; letter-spacing: -.06em; }
    .detail-prompt { margin: 18px 0 0; font-size: 16px; line-height: 1.4; }
    .use-prompt {
      min-height: 52px;
      padding: 0 20px;
      border: 1px solid var(--ink);
      background: var(--yellow);
      font-weight: 700;
      cursor: pointer;
    }

    details { margin: 80px 0 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    summary { min-height: 46px; display: flex; align-items: center; cursor: pointer; font-size: 12px; }
    details p { margin: 0 0 16px; max-width: 62ch; color: var(--quiet); font-size: 12px; line-height: 1.5; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 560px); }
      header { height: 56px; }
      .intro { padding: 20px 0 24px; }
      .composer-wrap {
        position: sticky;
        z-index: 10;
        top: 0;
        padding: 8px 0;
        background: var(--paper);
      }
      form { min-height: 76px; }
      textarea { min-height: 74px; padding: 15px 13px; font-size: 21px; }
      .make { min-width: 92px; }
      .section-line { margin-top: 0; }
      .gallery { display: grid; grid-template-columns: 1fr; grid-template-rows: none; gap: 40px; border: 0; background: transparent; }
      .set-card, .set-card:first-child, .set-card:nth-child(2), .set-card:nth-child(3), .set-card:nth-child(n+4) { grid-column: auto; grid-row: auto; aspect-ratio: 4 / 3; border: 1px solid var(--ink); }
      .card-copy { padding: 12px 14px 13px; }
      .card-title { font-size: 18px; }
      .card-prompt { white-space: normal; font-size: 13px; line-height: 1.3; }
      .detail-grid { display: block; min-height: 0; }
      .detail-figure { aspect-ratio: 1 / 1; }
      .detail-copy { padding: 24px 18px; border-top: 1px solid var(--ink); border-left: 0; }
      .detail-copy h2 { font-size: 42px; }
      .use-prompt { width: 100%; }
      details { margin-top: 56px; }
    }

    @media (prefers-reduced-motion: reduce) { .set-card img { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="#" id="home-link">blawx</a>
    </header>

    <section class="intro" aria-label="Make a set">
      <div class="composer-wrap">
        <form id="prompt-form">
          <textarea id="prompt-input" rows="2" aria-label="Describe a LEGO set" placeholder="What would you like to build?" autocomplete="off"></textarea>
          <button class="make" type="submit">Generate</button>
        </form>
        <p class="privacy">Prompts and sets are public.</p>
        <p class="form-note" id="form-note" aria-live="polite"></p>
      </div>
    </section>

    <section class="gallery-view" id="gallery-view">
      <div class="section-line">
        <h2>Recently made</h2>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="detail" id="detail" hidden>
      <div class="detail-nav">
        <button class="text-button" id="back-button" type="button">← Back to gallery</button>
      </div>
      <div class="detail-grid">
        <figure class="detail-figure"><img id="detail-image" src="" alt=""></figure>
        <div class="detail-copy">
          <div>
            <h2 id="detail-title"></h2>
            <p class="detail-prompt" id="detail-prompt"></p>
          </div>
          <button class="use-prompt" id="use-prompt" type="button">Use this prompt</button>
        </div>
      </div>
    </section>

    <details>
      <summary>Developer</summary>
      <p>Saved Shapes 42–47 mockups. This exploration uses prepared stills and does not run live generation.</p>
    </details>
  </main>

  <script type="module">
    import { SETS, prepareImages } from './shared.js';

    const gallery = document.querySelector('#gallery');
    const galleryView = document.querySelector('#gallery-view');
    const detail = document.querySelector('#detail');
    const input = document.querySelector('#prompt-input');
    const note = document.querySelector('#form-note');
    const detailImage = document.querySelector('#detail-image');
    const detailTitle = document.querySelector('#detail-title');
    const detailPrompt = document.querySelector('#detail-prompt');
    let selected = null;

    await prepareImages();

    const featureOrder = ['dragon', 'cat', 'pickup', 'reef', 'spaghetti', 'tv'];
    const orderedSets = featureOrder.map(id => SETS.find(set => set.id === id)).filter(Boolean);

    orderedSets.forEach(set => {
      const card = document.createElement('button');
      card.className = 'set-card';
      card.type = 'button';
      card.innerHTML = `
        <img src="${set.image}" alt="">
        <span class="card-copy">
          <span class="card-prompt">${set.prompt}</span>
        </span>`;
      card.addEventListener('click', () => openSet(set));
      gallery.append(card);
    });

    function openSet(set) {
      selected = set;
      detailImage.src = set.image;
      detailImage.alt = `${set.title} LEGO-style set`;
      detailTitle.textContent = set.title;
      detailPrompt.textContent = set.prompt;
      galleryView.hidden = true;
      detail.hidden = false;
      document.querySelector('#back-button').focus({ preventScroll: true });
      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showGallery() {
      detail.hidden = true;
      galleryView.hidden = false;
      selected = null;
      galleryView.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.querySelector('#back-button').addEventListener('click', showGallery);
    document.querySelector('#home-link').addEventListener('click', event => {
      event.preventDefault();
      showGallery();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.querySelector('#use-prompt').addEventListener('click', () => {
      if (!selected) return;
      input.value = selected.prompt;
      note.textContent = '';
      input.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.querySelector('#prompt-form').addEventListener('submit', event => {
      event.preventDefault();
      const query = input.value.trim().toLocaleLowerCase();
      const match = SETS.find(set =>
        set.title.toLocaleLowerCase() === query || set.prompt.toLocaleLowerCase() === query
      );
      if (match) {
        note.textContent = '';
        openSet(match);
      } else {
        note.textContent = 'Choose a saved set for this preview.';
      }
    });
  </script>
</body>
</html>
