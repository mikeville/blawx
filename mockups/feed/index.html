<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blawx — landing explorations</title>
<style>
:root{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#20201e;background:#e7e7e4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 24px;background:#f4f4f4;border-bottom:1px solid #c8c8c5;flex-wrap:wrap}h1{font-size:14px;letter-spacing:-.2px;margin:0}nav,.sizes{display:flex;gap:4px}button{border:0;background:transparent;min-height:44px;padding:8px 14px;font-size:13px}button[aria-pressed=true]{background:#20201e;color:#f4f4f4;border-radius:3px}.tools{display:flex;align-items:center;gap:24px}.tools a{font-size:12px;text-underline-offset:4px}#thesis{font-size:13px;line-height:1.5;margin:0;padding:12px 24px;text-align:center;color:#50504c}.viewport{margin:0 auto 24px;transition:max-width .18s ease;width:100%;max-width:1440px;background:#f4f4f4;box-shadow:0 0 0 1px #d0d0cb}.viewport[data-size=phone]{max-width:390px}.viewport iframe{display:block;border:0;width:100%;height:calc(100dvh - 150px);min-height:600px}.viewport[data-size=phone] iframe{height:844px}button:focus-visible,a:focus-visible{outline:2px solid #bd9100;outline-offset:3px}@media(max-width:760px){header{padding:8px 12px;gap:4px}header h1{width:100%;font-size:11px;color:#666;margin:4px 4px}.tools{gap:8px}nav button{padding:8px 10px;font-size:12px}.sizes{display:none}#thesis{padding:10px 16px;font-size:12px;text-align:left}.viewport iframe{height:calc(100dvh - 150px)}.viewport{margin-bottom:0}header .tools a{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><h1>Blawx / layout studies</h1><nav aria-label="Design option"><button data-option="0" aria-pressed="true">01 Workbench</button><button data-option="1" aria-pressed="false">02 Catalogue</button><button data-option="2" aria-pressed="false">03 Focus</button></nav><div class="tools"><div class="sizes" aria-label="Preview width"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="phone" aria-pressed="false">Phone</button></div><a id="open" href="./01-workbench.html" target="_blank" rel="noopener">Open ↗</a></div></header>
<p id="thesis">A set stays on stage. Create beside it; browse a small gallery below.</p>
<main class="viewport" data-size="desktop"><iframe title="Workbench mockup" src="./01-workbench.html"></iframe></main>
<script>
const options=[['01-workbench.html','Workbench','A set stays on stage. Create beside it; browse a small gallery below.'],['02-catalogue.html','Catalogue','The gallery is the front door. Find an idea, or start one of your own.'],['03-focus.html','Focus','One set, one prompt. The gallery is a separate place to explore.']];
const frame=document.querySelector('iframe');
document.querySelectorAll('[data-option]').forEach(button=>button.onclick=()=>{const option=options[Number(button.dataset.option)];frame.src='./'+option[0];frame.title=option[1]+' mockup';document.querySelector('#open').href='./'+option[0];document.querySelector('#thesis').textContent=option[2];document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
document.querySelectorAll('button[data-size]').forEach(button=>button.onclick=()=>{document.querySelector('.viewport').dataset.size=button.dataset.size;document.querySelectorAll('button[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
</script></body></html>
