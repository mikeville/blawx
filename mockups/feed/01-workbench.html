<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blawx — Workbench</title>
  <style>
    :root {
      --paper: #f4f4f4;
      --ink: #1a1a1a;
      --yellow: #ffcc00;
      --muted: #6d6d68;
      --rule: rgba(26, 26, 26, .32);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); color: var(--ink); font-family: Helvetica, Arial, sans-serif; }
    body { margin: 0; min-width: 320px; }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .shell { min-height: 100vh; padding: 16px; }
    .masthead {
      height: 48px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid var(--ink);
    }
    .wordmark { font-size: 21px; font-weight: 700; letter-spacing: -.06em; }
    .workbench { display: grid; }
    .stage {
      position: relative;
      min-height: 280px;
      border-bottom: 1px solid var(--ink);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .stage img {
      width: min(92%, 580px);
      height: 260px;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: opacity 180ms steps(2, end);
    }
    .stage img.switching { opacity: 0; }
    .stage-title {
      position: absolute;
      left: 0;
      bottom: 14px;
      margin: 0;
      font-size: 13px;
      font-weight: 400;
    }
    .pause {
      position: absolute; top: 4px; left: -12px; width: 44px; height: 44px; padding: 0;
      border: 0; background: transparent; font-size: 13px;
    }
    .open-set {
      position: absolute; right: 0; bottom: 4px; min-height: 44px; padding: 0;
      border: 0; background: transparent; text-decoration: underline; text-underline-offset: 4px;
    }

    .panel { padding: 28px 0 30px; border-bottom: 1px solid var(--ink); }
    form { display: grid; gap: 10px; }
    label { font-size: 12px; font-weight: 700; }
    textarea {
      width: 100%;
      min-height: 88px;
      padding: 13px 12px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      outline: none;
      resize: none;
      font-size: 22px;
      line-height: 1.08;
      letter-spacing: -.025em;
    }
    textarea::placeholder { color: #777772; opacity: 1; }
    textarea:focus { box-shadow: inset 0 0 0 2px var(--yellow); }
    .make {
      min-height: 50px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 700;
    }
    .make:hover { background: #f5c400; }
    .disclosure, .message { margin: 11px 2px 0; font-size: 11px; line-height: 1.35; color: var(--muted); }
    .message { min-height: 15px; color: var(--ink); }
    .result-actions { display: none; margin-top: 16px; gap: 8px; }
    .result-actions.visible { display: flex; }
    .secondary {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: transparent;
    }
    .secondary:hover { background: #fff; }

    .feed { padding: 28px 0 40px; }
    .feed-head { display: flex; min-height: 44px; align-items: flex-start; justify-content: space-between; }
    h2 { margin: 5px 0 0; font-size: 15px; }
    .gallery-toggle { min-height: 44px; padding: 0; border: 0; background: transparent; text-decoration: underline; text-underline-offset: 4px; }
    .sets { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--ink); }
    .set {
      width: 100%; min-height: 270px; padding: 14px 0 12px; border: 0; border-bottom: 1px solid var(--rule);
      background: transparent; text-align: left; display: grid; grid-template-rows: 1fr auto; position: relative;
    }
    .set[aria-current="true"]::before { content: ""; position: absolute; top: -1px; left: 0; width: 46px; height: 5px; background: var(--yellow); }
    .set img { width: 100%; height: 220px; object-fit: contain; mix-blend-mode: multiply; }
    .set-name { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .set-name span:last-child { color: var(--muted); font-size: 11px; }
    .set:nth-child(n+4) { display: none; }
    .sets.expanded .set { display: grid; }

    details { border-top: 1px solid var(--rule); }
    summary { min-height: 48px; display: flex; align-items: center; font-size: 11px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; margin-left: auto; font-size: 16px; }
    details[open] summary::after { content: "−"; }
    details p { margin: 0 0 18px; color: var(--muted); font-size: 11px; }

    @media (min-width: 760px) {
      .shell { padding: 20px 28px; }
      .workbench { grid-template-columns: minmax(0, 1.4fr) minmax(310px, 1fr); border-bottom: 1px solid var(--ink); }
      .stage { min-height: 650px; border-right: 1px solid var(--ink); border-bottom: 0; padding-right: 28px; }
      .stage img { width: min(94%, 760px); height: 590px; }
      .stage-title { bottom: 18px; }
      .open-set { right: 28px; }
      .pause { left: -12px; }
      .panel { min-width: 0; padding: 42px 0 32px 30px; border-bottom: 0; display: flex; flex-direction: column; justify-content: center; }
      textarea { min-height: 116px; font-size: 27px; }
      .feed { padding-top: 30px; }
      .sets { grid-template-columns: repeat(3, 1fr); }
      .set { min-height: 260px; padding: 14px 18px 12px; border-right: 1px solid var(--rule); }
      .set:nth-child(3n) { border-right: 0; }
      .set img { height: 210px; }
    }

    @media (min-width: 1180px) {
      .shell { padding: 22px 40px; }
      .workbench { grid-template-columns: minmax(0, 1.5fr) minmax(390px, 1fr); }
      .stage { min-height: 660px; padding-right: 40px; }
      .stage img { height: 610px; }
      .panel { padding: 46px 4px 34px 36px; }
      .set { min-height: 280px; }
      .set img { height: 230px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="wordmark">blawx</div>
    </header>

    <section class="workbench" aria-label="Set workbench">
      <div class="stage" aria-live="polite">
        <img id="hero-image" alt="">
        <button class="pause" id="pause" type="button" aria-label="Pause examples">Ⅱ</button>
        <button class="open-set" id="open-set" type="button">Open set</button>
        <p class="stage-title" id="hero-title"></p>
      </div>

      <div class="panel">
        <form id="prompt-form">
          <label class="sr-only" for="prompt">What would you like to build?</label>
          <textarea id="prompt" name="prompt" autocomplete="off" rows="3" placeholder="What would you like to build?"></textarea>
          <button class="make" type="submit">Make it</button>
        </form>
        <p class="disclosure">Prompts and sets are public.</p>
        <p class="message" id="message" role="status"></p>
        <div class="result-actions" id="result-actions">
          <button class="secondary" id="use-prompt" type="button">Use this prompt</button>
          <button class="secondary" id="create-another" type="button">Create another</button>
        </div>
      </div>
    </section>

    <section class="feed" aria-labelledby="feed-title">
      <div class="feed-head">
        <h2 id="feed-title">Recently made</h2>
        <button class="gallery-toggle" id="gallery-toggle" type="button" aria-expanded="false">View gallery</button>
      </div>
      <div class="sets" id="sets"></div>
    </section>

    <details>
      <summary>Developer</summary>
      <p>Saved Shapes 42–47 mockup. No generation is performed here.</p>
    </details>
  </main>

  <script type="module">
    import { SETS, prepareImages } from './shared.js';

    const form = document.querySelector('#prompt-form');
    const input = document.querySelector('#prompt');
    const heroImage = document.querySelector('#hero-image');
    const heroTitle = document.querySelector('#hero-title');
    const message = document.querySelector('#message');
    const actions = document.querySelector('#result-actions');
    const setsElement = document.querySelector('#sets');
    const galleryToggle = document.querySelector('#gallery-toggle');
    const usePrompt = document.querySelector('#use-prompt');
    const createAnother = document.querySelector('#create-another');
    const pause = document.querySelector('#pause');
    const openSet = document.querySelector('#open-set');

    let selected = SETS[0];
    let resultMode = false;
    let cycleIndex = 0;
    let cycleTimer;
    let transitionTimer;
    let cycling = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function stopCycling() {
      cycling = false;
      window.clearInterval(cycleTimer);
      window.clearTimeout(transitionTimer);
      heroImage.classList.remove('switching');
      pause.textContent = '▶';
      pause.setAttribute('aria-label', 'Play examples');
    }

    function startCycling() {
      cycling = true;
      window.clearInterval(cycleTimer);
      pause.textContent = 'Ⅱ';
      pause.setAttribute('aria-label', 'Pause examples');
      cycleTimer = window.setInterval(() => {
        cycleIndex = (cycleIndex + 1) % SETS.length;
        heroImage.classList.add('switching');
        transitionTimer = window.setTimeout(() => {
          renderHero(SETS[cycleIndex], false);
          heroImage.classList.remove('switching');
        }, 190);
      }, 5500);
    }

    function renderHero(set, asResult = false) {
      selected = set;
      resultMode = asResult;
      heroImage.src = set.image;
      heroImage.alt = `${set.title} LEGO-style model`;
      heroTitle.textContent = set.title;
      actions.classList.toggle('visible', resultMode);
      setsElement.querySelectorAll('.set').forEach((button) => {
        button.setAttribute('aria-current', String(button.dataset.id === set.id));
      });
    }

    function addSet(set, index) {
      const button = document.createElement('button');
      button.className = 'set';
      button.type = 'button';
      button.dataset.id = set.id;
      button.innerHTML = `
        <img src="${set.image}" alt="" loading="lazy">
        <span class="set-name"><span>${set.prompt}</span></span>
      `;
      button.addEventListener('click', () => {
        stopCycling();
        renderHero(set, true);
        message.textContent = '';
        document.querySelector('.workbench').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      setsElement.append(button);
    }

    await prepareImages();
    SETS.forEach(addSet);
    renderHero(selected, false);
    if (cycling) startCycling();
    else stopCycling();

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = input.value.trim().toLowerCase();
      const match = SETS.find((set) => set.title.toLowerCase() === query || set.prompt.toLowerCase() === query);
      if (!match) {
        stopCycling();
        message.textContent = 'Choose a saved set for this preview.';
        return;
      }
      message.textContent = '';
      stopCycling();
      renderHero(match, true);
    });

    input.addEventListener('input', stopCycling);

    pause.addEventListener('click', () => {
      if (cycling) stopCycling();
      else startCycling();
    });

    openSet.addEventListener('click', () => {
      stopCycling();
      renderHero(selected, true);
    });

    usePrompt.addEventListener('click', () => {
      input.value = selected.prompt;
      input.focus();
      message.textContent = '';
    });

    createAnother.addEventListener('click', () => {
      resultMode = false;
      actions.classList.remove('visible');
      input.value = '';
      input.focus();
      message.textContent = '';
    });

    galleryToggle.addEventListener('click', () => {
      const expanded = setsElement.classList.toggle('expanded');
      galleryToggle.setAttribute('aria-expanded', String(expanded));
      galleryToggle.textContent = expanded ? 'Show less' : 'View gallery';
    });
  </script>
</body>
</html>
