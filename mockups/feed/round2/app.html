<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <title>Blawx</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./guide.css">
  <link rel="stylesheet" href="./composer.css">
</head>
<body>
  <header class="brand-strip">
    <a class="brand" id="brand-home" href="./app.html" aria-label="Blawx home">Blawx</a>
  </header>

  <main>
    <div id="home-view">
      <section class="home-lead" aria-label="Featured set and prompt">
        <div class="home-hero">
          <div class="hero-mount" id="home-hero"></div>
        </div>

        <div class="composer">
          <form id="prompt-form" novalidate>
            <label class="sr-only" for="prompt">What would you like to build?</label>
            <div class="prompt-field">
              <div class="prompt-invitation" aria-hidden="true">What would you like to build?<span class="invitation-caret"></span></div>
              <input id="prompt" name="prompt" type="text" autocomplete="off" spellcheck="true" placeholder=" " enterkeyhint="go">
            </div>
            <button class="make-button" type="submit">Make it</button>
          </form>
          <p class="form-message" id="form-message" role="status"></p>
        </div>
      </section>

      <section class="recent" aria-labelledby="recent-title">
        <div class="section-heading">
          <h1 id="recent-title">Recently made</h1>
        </div>
        <div class="gallery" id="gallery"></div>
        <button class="show-more" id="show-more" type="button">Show more</button>
      </section>
    </div>

    <div id="detail-view" hidden>
      <article class="set-detail">
        <div class="detail-hero hero-mount" id="detail-hero"></div>
        <header class="detail-copy">
          <h1 id="detail-title" tabindex="-1"></h1>
          <p class="detail-prompt" id="detail-prompt"></p>
        </header>
      </article>

      <section class="instructions" aria-label="Instructions">
        <div id="guide-host"></div>
      </section>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
