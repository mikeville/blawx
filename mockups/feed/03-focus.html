<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blawx — Focused set maker</title>
    <style>
      :root {
        --paper: #f4f4f4;
        --ink: #1a1a1a;
        --yellow: #ffcc00;
        --rule: color-mix(in srgb, var(--ink) 22%, var(--paper));
        --muted: color-mix(in srgb, var(--ink) 62%, var(--paper));
        --s1: 0.25rem;
        --s2: 0.5rem;
        --s3: 0.75rem;
        --s4: 1rem;
        --s6: 1.5rem;
        --s8: 2rem;
        --s12: 3rem;
        --s16: 4rem;
        --page: min(100% - 2rem, 84rem);
      }

      * { box-sizing: border-box; }

      html { background: var(--paper); color: var(--ink); }

      body {
        min-width: 20rem;
        margin: 0;
        font-family: Helvetica, "Helvetica Neue", sans-serif;
        font-size: 1rem;
        line-height: 1.35;
        background: var(--paper);
      }

      button, input, textarea { font: inherit; color: inherit; }
      button, a, input { -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }

      :focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }

      .shell { width: var(--page); margin-inline: auto; }

      header {
        min-height: 4rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--ink);
      }

      .brand {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.035em;
        text-decoration: none;
      }

      .nav-link {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        font-size: 0.875rem;
        text-underline-offset: 0.25rem;
      }

      main { min-height: calc(100vh - 4rem); }

      .creation {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-block: var(--s4) var(--s6);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .stage-heading {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 3rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .model-stage {
        position: relative;
        height: clamp(260px, 42svh, 440px);
        display: grid;
        place-items: center;
        padding: 0;
        overflow: hidden;
      }

      .pause-animation {
        position: absolute;
        right: 0;
        bottom: var(--s2);
        min-height: 2.75rem;
        min-width: 2.75rem;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.75rem;
        text-decoration: underline;
        text-underline-offset: 0.2rem;
        cursor: pointer;
      }

      .brick-study.paused .brick { animation-play-state: paused; }

      .model-stage img {
        display: block;
        width: min(100%, 37rem);
        height: min(42vh, 31rem);
        object-fit: contain;
        filter: saturate(0.94) contrast(1.01);
      }

      .brick-study {
        width: min(100%, 36rem);
        height: 100%;
        overflow: hidden;
      }

      .brick-study .brick {
        transform-box: fill-box;
        transform-origin: center;
        animation: assemble 7s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
      }

      .brick-study .b2 { animation-delay: -1.1s; }
      .brick-study .b3 { animation-delay: -2.2s; }
      .brick-study .b4 { animation-delay: -3.3s; }
      .brick-study .b5 { animation-delay: -4.4s; }
      .brick-study .b6 { animation-delay: -5.5s; }

      @keyframes assemble {
        0%, 18% { transform: translate(var(--x), var(--y)) rotate(var(--r)); }
        72%, 100% { transform: translate(0, 0) rotate(0); }
      }

      .composer {
        display: grid;
        gap: var(--s3);
        border-top: 1px solid var(--ink);
        padding-top: var(--s3);
      }

      .composer label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s2);
      }

      textarea {
        width: 100%;
        min-height: 5.25rem;
        border: 1px solid var(--ink);
        border-radius: 0;
        padding: var(--s3) var(--s4);
        background: transparent;
        font-size: 1.25rem;
        line-height: 1.2;
        resize: none;
      }

      textarea::placeholder { color: var(--muted); opacity: 1; }

      .button {
        min-height: 3.25rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0 var(--s6);
        background: var(--yellow);
        font-weight: 700;
        cursor: pointer;
      }

      .button.secondary { background: transparent; }
      .button:hover { filter: brightness(0.96); }

      .message {
        min-height: 1.35rem;
        margin: 0;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .message:empty { display: none; }
      .public-note { margin: 0; font-size: 11px; color: var(--muted); }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }

      .quick-actions { display: flex; align-items: center; gap: var(--s4); }

      .text-button {
        min-height: 2.75rem;
        border: 0;
        padding: 0;
        background: transparent;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.25rem;
        cursor: pointer;
      }

      .gallery { padding-block: var(--s8) var(--s16); }

      .gallery-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--s4);
        margin-bottom: var(--s12);
      }

      .gallery h1 {
        margin: 0;
        font-size: clamp(2.25rem, 12vw, 5.5rem);
        line-height: 0.88;
        letter-spacing: -0.065em;
      }

      .gallery-grid { display: grid; gap: var(--s12); }

      .set-card {
        display: grid;
        gap: var(--s3);
        color: inherit;
        text-decoration: none;
      }

      .set-image {
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--ink);
        padding: var(--s4);
      }

      .set-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .set-card:hover img { transform: translateY(-0.25rem); }

      .set-card h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .set-card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8125rem;
        line-height: 1.4;
      }

      footer {
        padding-block: var(--s6);
        border-top: 1px solid var(--ink);
        font-size: 0.75rem;
      }

      footer p { margin: 0; }
      details summary { min-height: 2.75rem; display: flex; align-items: center; cursor: pointer; font-size: 0.75rem; }
      details p { max-width: 64ch; color: var(--muted); }

      [hidden] { display: none !important; }

      @media (min-width: 48rem) {
        :root { --page: min(100% - 4rem, 84rem); }
        .creation { padding-block: var(--s6) var(--s8); max-width: 1040px; margin: auto; }
        .stage-heading { font-size: clamp(2.5rem, 4vw, 4.5rem); }
        .model-stage { height: min(55vh, 560px); min-height: 0; padding: 0; }
        .model-stage img { width: min(65vw, 47rem); height: min(57vh, 38rem); }
        .composer { padding-top: var(--s4); }
        .input-row { grid-template-columns: minmax(0, 1fr) auto; }
        textarea { min-height: 5.75rem; font-size: 1.5rem; }
        .gallery { padding-block: var(--s12) 8rem; }
        .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--s8); row-gap: var(--s16); }
      }

      @media (prefers-reduced-motion: reduce) {
        .set-image img { transition: none; }
        .brick-study .brick { animation: none; }
      }
    </style>
  </head>
  <body>
    <header class="shell">
      <a class="brand" href="#create">Blawx</a>
      <a class="nav-link" id="nav-link" href="#gallery">Gallery</a>
    </header>

    <main class="shell" id="app"></main>


    <script type="module">
      import { SETS } from './shared.js';

      const app = document.querySelector('#app');
      const navLink = document.querySelector('#nav-link');
      let draft = sessionStorage.getItem('blawx-focus-draft') || '';
      let selectedId = sessionStorage.getItem('blawx-focus-set') || 'cat';

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      function selectedSet() {
        return SETS.find((set) => set.id === selectedId) || SETS[0];
      }

      function brickStudy() {
        return `<svg class="brick-study" viewBox="0 0 640 520" role="img" aria-label="Colorful ordinary bricks slowly assembling">
          <defs>
            <g id="brick">
              <path d="M0 28 90 0l74 29-90 29Z" fill="currentColor" />
              <path d="M0 28v36l74 30V58Z" fill="color-mix(in srgb, currentColor 72%, #1a1a1a)" />
              <path d="m74 58 90-29v36L74 94Z" fill="color-mix(in srgb, currentColor 84%, #1a1a1a)" />
              <g fill="currentColor" stroke="#1a1a1a" stroke-width="1">
                <ellipse cx="42" cy="35" rx="10" ry="4"/><ellipse cx="63" cy="29" rx="10" ry="4"/>
                <ellipse cx="84" cy="22" rx="10" ry="4"/><ellipse cx="105" cy="16" rx="10" ry="4"/>
                <ellipse cx="64" cy="44" rx="10" ry="4"/><ellipse cx="85" cy="38" rx="10" ry="4"/>
                <ellipse cx="106" cy="31" rx="10" ry="4"/><ellipse cx="127" cy="25" rx="10" ry="4"/>
              </g>
            </g>
          </defs>
          <g transform="translate(220 65)">
            <use class="brick b1" href="#brick" color="#ffcc00" style="--x:-100px;--y:-28px;--r:-8deg"/>
            <use class="brick b2" href="#brick" color="#d7271f" x="42" y="52" style="--x:100px;--y:-35px;--r:11deg"/>
            <use class="brick b3" href="#brick" color="#1769aa" x="-26" y="104" style="--x:-115px;--y:24px;--r:8deg"/>
            <use class="brick b4" href="#brick" color="#3a3a38" x="40" y="156" style="--x:100px;--y:35px;--r:-9deg"/>
            <use class="brick b5" href="#brick" color="#ffcc00" x="-20" y="208" style="--x:-100px;--y:34px;--r:7deg"/>
            <use class="brick b6" href="#brick" color="#d7271f" x="22" y="260" style="--x:95px;--y:30px;--r:-6deg"/>
          </g>
        </svg>`;
      }

      function renderCreation(set = null, detail = false) {
        if (set) {
          selectedId = set.id;
          sessionStorage.setItem('blawx-focus-set', selectedId);
        }
        navLink.textContent = 'Gallery';
        navLink.href = '#gallery';
        app.innerHTML = `
          <section class="creation" aria-labelledby="creation-title">
            <h1 class="${set ? 'stage-heading' : 'sr-only'}" id="creation-title">${set ? escapeHtml(set.title) : 'Name your set'}</h1>
            <div class="model-stage">
              ${set ? `<img src="${escapeHtml(set.image)}" alt="${escapeHtml(set.title)} LEGO-style set" />` : brickStudy()}
              ${set ? '' : '<button class="pause-animation" id="pause-animation" type="button" aria-label="Pause animation">Ⅱ</button>'}
            </div>
            <form class="composer" id="composer">
              <label class="sr-only" for="prompt">Your idea</label>
              <div class="input-row">
                <textarea id="prompt" name="prompt" rows="2" placeholder="What would you like to build?" autocomplete="off">${escapeHtml(detail ? set.prompt : draft)}</textarea>
                <button class="button" type="submit">Generate</button>
              </div>
              <p class="public-note">Prompts and sets are public.</p>
              <p class="message" id="message" aria-live="polite"></p>
              ${detail ? `<div class="detail-actions"><button class="button secondary" type="button" id="use-prompt">Use this prompt</button><a class="nav-link" href="#gallery">Back to gallery</a></div>` : `<div class="quick-actions"><button class="text-button" type="button" id="surprise">Surprise me</button></div>`}
              <details><summary>Developer</summary><p>Saved Shapes42–47. Layout mockup only; no live generation.</p></details>
            </form>
          </section>`;

        const input = app.querySelector('#prompt');
        const message = app.querySelector('#message');
        input.addEventListener('input', () => {
          draft = input.value;
          sessionStorage.setItem('blawx-focus-draft', draft);
        });

        app.querySelector('#composer').addEventListener('submit', (event) => {
          event.preventDefault();
          draft = input.value.trim();
          sessionStorage.setItem('blawx-focus-draft', draft);
          const normalized = draft.toLocaleLowerCase();
          const match = SETS.find((item) => item.prompt.trim().toLocaleLowerCase() === normalized);
          if (match) {
            selectedId = match.id;
            location.hash = `set/${match.id}`;
          } else {
            message.textContent = 'Choose a saved set for this preview.';
          }
        });

        const usePrompt = app.querySelector('#use-prompt');
        if (usePrompt) {
          usePrompt.addEventListener('click', () => {
            draft = set.prompt;
            sessionStorage.setItem('blawx-focus-draft', draft);
            location.hash = 'create';
          });
        }
        const surprise = app.querySelector('#surprise');
        if (surprise) {
          surprise.addEventListener('click', () => {
            const pool = SETS.filter((item) => item.id !== selectedId);
            const next = pool[Math.floor(Math.random() * pool.length)] || SETS[0];
            location.hash = `set/${next.id}`;
          });
        }
        const pauseAnimation = app.querySelector('#pause-animation');
        if (pauseAnimation) {
          pauseAnimation.addEventListener('click', () => {
            const study = app.querySelector('.brick-study');
            const paused = study.classList.toggle('paused');
            pauseAnimation.textContent = paused ? '▶' : 'Ⅱ';
            pauseAnimation.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
            pauseAnimation.setAttribute('aria-pressed', String(paused));
          });
        }
      }

      function renderGallery() {
        navLink.textContent = 'Create';
        navLink.href = '#create';
        app.innerHTML = `
          <section class="gallery" aria-labelledby="gallery-title">
            <div class="gallery-head">
              <h1 id="gallery-title">Gallery</h1>
            </div>
            <div class="gallery-grid">
              ${SETS.map((set) => `
                <a class="set-card" href="#set/${escapeHtml(set.id)}">
                  <span class="set-image"><img src="${escapeHtml(set.image)}" alt="" /></span>
                  ${set.title.trim().toLocaleLowerCase() === set.prompt.trim().toLocaleLowerCase() ? '' : `<h2>${escapeHtml(set.title)}</h2>`}
                  <p>${escapeHtml(set.prompt)}</p>
                </a>`).join('')}
            </div>
          </section>`;
      }

      function route() {
        const routeName = location.hash.slice(1) || 'create';
        if (routeName === 'gallery') {
          renderGallery();
        } else if (routeName.startsWith('set/')) {
          const id = routeName.split('/')[1];
          renderCreation(SETS.find((set) => set.id === id) || selectedSet(), true);
        } else {
          renderCreation();
        }
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      window.addEventListener('hashchange', route);
      route();
    </script>
  </body>
</html>
